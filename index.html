<!DOCTYPE html>
<html lang="en">
<head>
<!-- Trigger Pages rebuild: 2026-09-05T14:30:00Z -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Session Log</title>
<style>
  :root{
    --bg: #ECE8DE;
    --surface: #FFFFFF;
    --surface-sunken: #E2DDCF;
    --ink: #2A2B24;
    --ink-soft: #6B6D5F;
    --line: #D7D1BF;
    --sage: #3C5A4C;
    --sage-soft: #DCE5DE;
    --plum: #6E4F63;
    --plum-soft: #EBE1E6;
    --weekend: #C9C3AF;
    --radius: 10px;
    font-size: 16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family: 'Iowan Old Style','Georgia',serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .brand{
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .brand-sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  /* Therapist rail */
  .therapist-rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom: 4px;
    margin-bottom: 16px;
    scrollbar-width:none;
  }
  .therapist-rail::-webkit-scrollbar{display:none;}
  .chip{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    flex: 0 0 auto;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip.active{
    background: var(--sage);
    color: #fff;
    border-color: var(--sage);
  }
  .chip.add{
    color: var(--plum);
    border-color: var(--plum-soft);
    background: var(--plum-soft);
    font-weight: 600;
  }

  /* Segmented view control */
  .segmented{
    display:flex;
    background: var(--surface-sunken);
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .segmented button{
    flex:1;
    border:none;
    background:transparent;
    padding: 8px 0;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    border-radius: 999px;
    cursor:pointer;
  }
  .segmented button.active{
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .empty-state{
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align:center;
    color: var(--ink-soft);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .empty-state button{
    margin-top:14px;
    font-family: inherit;
    background: var(--sage);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius: 8px;
    font-weight:600;
    font-size:0.85rem;
  }

  /* Nav row */
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .nav-row .period-label{
    font-size: 1.15rem;
    font-weight: 600;
  }
  .nav-btn{
    background: var(--surface);
    border: 1px solid var(--line);
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    color: var(--ink);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .total-banner{
    background: var(--sage-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .total-banner .num{
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--sage);
    line-height:1;
  }
  .total-banner .label{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-transform: none;
  }
  .existing-therapist .del-x + .del-x{ margin-left: 4px; }

  /* Month grid */
  .weekday-row{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.7rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .weekday-row div{ text-align:center; }
  .month-grid{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .day-cell{
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.85rem;
    color: var(--ink);
    cursor:pointer;
    position: relative;
    transition: background .12s, color .12s, transform .08s;
  }
  .day-cell:active{ transform: scale(0.93); }
  .day-cell.empty{ background:transparent; border:none; cursor:default; }
  .day-cell.weekend{ background: var(--surface-sunken); color: var(--ink-soft); }
  .day-cell.attended{ background: var(--sage); color:#fff; border-color:var(--sage); font-weight:700; }
  .day-cell.today{ box-shadow: 0 0 0 2px var(--plum) inset; }

  /* Week view */
  .week-list{ display:flex; flex-direction:column; gap:8px; }
  .week-row{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .week-row.attended{ background: var(--sage-soft); border-color: var(--sage); }
  .week-row .wd-name{ font-weight:600; font-size:0.92rem; }
  .week-row .wd-date{ font-size:0.78rem; color:var(--ink-soft); }
  .week-row .mark{
    width:26px; height:26px; border-radius:50%;
    border: 1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:0.85rem; color:#fff;
  }
  .week-row.attended .mark{ background: var(--sage); border-color: var(--sage); }

  /* Year view */
  .year-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .year-card{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 8px;
    text-align:center;
    cursor:pointer;
  }
  .year-card .m-name{
    font-size: 0.82rem;
    font-weight:600;
    margin-bottom:6px;
  }
  .year-card .m-total{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 1.3rem;
    font-weight:700;
    color: var(--sage);
  }
  .year-card .m-sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.62rem;
    color: var(--ink-soft);
  }
  .year-total{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align:center;
    color: var(--ink-soft);
    font-size:0.8rem;
    margin-top:14px;
  }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,28,22,0.4);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet{
    background: var(--surface);
    width:100%; max-width:480px;
    border-radius: 16px 16px 0 0;
    padding: 22px 20px 28px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .sheet h3{ font-family:'Iowan Old Style','Georgia',serif; font-size:1.15rem; margin-bottom:14px; }
  .sheet input{
    width:100%;
    padding: 11px 12px;
    border-radius:8px;
    border: 1px solid var(--line);
    font-size: 0.95rem;
    margin-bottom: 14px;
    font-family: inherit;
  }
  .sheet .row{ display:flex; gap:10px; }
  .sheet button{
    flex:1;
    padding: 11px 0;
    border-radius:8px;
    border:none;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
  }
  .btn-primary{ background: var(--sage); color:#fff; }
  .btn-secondary{ background: var(--surface-sunken); color: var(--ink); }
  .btn-danger{ background: #A85454; color:#fff; }
  .existing-therapist{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size:0.92rem;
  }
  .existing-therapist:last-child{ border-bottom:none; }
  .del-x{
    color:#A85454; font-size:0.8rem; font-weight:600; cursor:pointer;
    background:none; border:none; flex:none; padding:4px 8px;
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="brand">Session Log</div>
  <div class="brand-sub">Track attendance, one therapist at a time</div>

  <div class="therapist-rail" id="therapistRail"></div>

  <div id="mainArea"></div>
</div>

<div id="modalRoot"></div>

<script>
(function(){

  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAY_SHORT = ["M","T","W","T","F","S","S"];
  const WEEKDAY_FULL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

  let state = {
    therapists: [],
    activeTherapistId: null,
    attendance: {}, // { therapistId: { "YYYY-MM-DD": true } }
    view: "month" // month | week | year
  };

  let cursor = new Date(); // controls which month/week/year is displayed
  cursor.setHours(0,0,0,0);

  const STORAGE_KEY = "session-log-state";

  async function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.therapists = parsed.therapists || [];
        state.attendance = parsed.attendance || {};
        state.activeTherapistId = parsed.activeTherapistId || (state.therapists[0] ? state.therapists[0].id : null);
      }
    }catch(e){
      console.error("Could not load saved data", e);
    }
    render();
  }

  async function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        therapists: state.therapists,
        attendance: state.attendance,
        activeTherapistId: state.activeTherapistId
      }));
    }catch(e){
      console.error("Could not save", e);
    }
  }

  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function isSameDay(a,b){ return dateKey(a) === dateKey(b); }
  function isWeekend(d){ const day = d.getDay(); return day === 0 || day === 6; }

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function formatMoney(n){
    if(!n || isNaN(n)) return "₹0";
    return "₹" + n.toLocaleString('en-IN', { minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits: 2 });
  }

  function getActiveTherapist(){
    return state.therapists.find(t => t.id === state.activeTherapistId) || null;
  }

  function getActiveRate(){
    const t = getActiveTherapist();
    return t && t.rate ? t.rate : 0;
  }

  function getAttendanceMap(){
    if(!state.activeTherapistId) return {};
    return state.attendance[state.activeTherapistId] || {};
  }

  function toggleAttendance(d){
    if(!state.activeTherapistId) return;
    const key = dateKey(d);
    if(!state.attendance[state.activeTherapistId]) state.attendance[state.activeTherapistId] = {};
    const map = state.attendance[state.activeTherapistId];
    if(map[key]) delete map[key];
    else map[key] = true;
    saveState();
    render();
  }

  function countWorkingDaysAttended(year, month){
    // month is 0-indexed. Every day counts.
    const map = getAttendanceMap();
    let count = 0;
    Object.keys(map).forEach(k=>{
      const [y,m,day] = k.split("-").map(Number);
      if(y === year && (m-1) === month) count++;
    });
    return count;
  }

  function countWorkingDaysAttendedYear(year){
    const map = getAttendanceMap();
    let count = 0;
    Object.keys(map).forEach(k=>{
      const [y,m] = k.split("-").map(Number);
      if(y === year) count++;
    });
    return count;
  }

  // ---------- Rendering ----------

  function render(){
    renderTherapistRail();
    renderMain();
  }

  function renderTherapistRail(){
    const rail = document.getElementById("therapistRail");
    rail.innerHTML = "";
    state.therapists.forEach(t=>{
      const chip = document.createElement("div");
      chip.className = "chip" + (t.id === state.activeTherapistId ? " active" : "");
      chip.textContent = t.name;
      chip.onclick = ()=>{
        state.activeTherapistId = t.id;
        saveState();
        render();
      };
      chip.oncontextmenu = (e)=>{ e.preventDefault(); openManageSheet(); };
      let pressTimer;
      chip.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(openManageSheet, 550); });
      chip.addEventListener('touchend', ()=>{ clearTimeout(pressTimer); });
      rail.appendChild(chip);
    });
    const addChip = document.createElement("div");
    addChip.className = "chip add";
    addChip.textContent = state.therapists.length ? "+ Add" : "+ Add therapist";
    addChip.onclick = openAddSheet;
    rail.appendChild(addChip);

    if(state.therapists.length){
      const manageChip = document.createElement("div");
      manageChip.className = "chip";
      manageChip.textContent = "Manage";
      manageChip.onclick = openManageSheet;
      rail.appendChild(manageChip);
    }

    const backupChip = document.createElement("div");
    backupChip.className = "chip";
    backupChip.textContent = "Backup";
    backupChip.onclick = openBackupSheet;
    rail.appendChild(backupChip);
  }

  function renderMain(){
    const main = document.getElementById("mainArea");
    main.innerHTML = "";

    if(!state.activeTherapistId){
      main.innerHTML = `
        <div class="empty-state">
          Add a therapist to start logging attendance.
          <div><button id="emptyAddBtn">Add therapist</button></div>
        </div>`;
      document.getElementById("emptyAddBtn").onclick = openAddSheet;
      return;
    }

    // segmented control
    const seg = document.createElement("div");
    seg.className = "segmented";
    ["month","week","year"].forEach(v=>{
      const btn = document.createElement("button");
      btn.textContent = v.charAt(0).toUpperCase()+v.slice(1);
      btn.className = state.view === v ? "active" : "";
      btn.onclick = ()=>{ state.view = v; render(); };
      seg.appendChild(btn);
    });
    main.appendChild(seg);

    if(state.view === "month") renderMonthView(main);
    else if(state.view === "week") renderWeekView(main);
    else renderYearView(main);
  }

  function renderMonthView(main){
    const year = cursor.getFullYear();
    const month = cursor.getMonth();

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <div class="nav-btn" id="prevMonth">&#8249;</div>
      <div class="period-label">${MONTH_NAMES[month]} ${year}</div>
      <div class="nav-btn" id="nextMonth">&#8250;</div>
    `;
    main.appendChild(navRow);

    const total = countWorkingDaysAttended(year, month);
    const rate = getActiveRate();
    const cost = total * rate;
    const banner = document.createElement("div");
    banner.className = "total-banner";
    if(rate > 0){
      banner.innerHTML = `
        <div>
          <div class="num">${total}</div>
          <div class="label">day${total===1?"":"s"} attended this month</div>
        </div>
        <div style="margin-left:auto; text-align:right;">
          <div class="num" style="color:var(--plum);">${formatMoney(cost)}</div>
          <div class="label">at ${formatMoney(rate)}/day</div>
        </div>
      `;
    } else {
      banner.innerHTML = `<div class="num">${total}</div><div class="label">day${total===1?"":"s"} attended this month</div>`;
    }
    main.appendChild(banner);

    const weekdayRow = document.createElement("div");
    weekdayRow.className = "weekday-row";
    WEEKDAY_SHORT.forEach(w=>{
      const d = document.createElement("div");
      d.textContent = w;
      weekdayRow.appendChild(d);
    });
    main.appendChild(weekdayRow);

    const grid = document.createElement("div");
    grid.className = "month-grid";

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = (firstOfMonth.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const attendanceMap = getAttendanceMap();
    const today = new Date(); today.setHours(0,0,0,0);

    for(let i=0;i<startOffset;i++){
      const empty = document.createElement("div");
      empty.className = "day-cell empty";
      grid.appendChild(empty);
    }
    for(let day=1; day<=daysInMonth; day++){
      const d = new Date(year, month, day);
      const cell = document.createElement("div");
      let cls = "day-cell";
      if(attendanceMap[dateKey(d)]) cls += " attended";
      if(isSameDay(d, today)) cls += " today";
      cell.className = cls;
      cell.textContent = day;
      cell.onclick = ()=> toggleAttendance(d);
      grid.appendChild(cell);
    }
    main.appendChild(grid);

    document.getElementById("prevMonth").onclick = ()=>{
      cursor = new Date(year, month-1, 1);
      render();
    };
    document.getElementById("nextMonth").onclick = ()=>{
      cursor = new Date(year, month+1, 1);
      render();
    };
  }

  function startOfWeek(d){
    const copy = new Date(d);
    const diff = (copy.getDay() + 6) % 7; // days since Monday
    copy.setDate(copy.getDate() - diff);
    copy.setHours(0,0,0,0);
    return copy;
  }

  function renderWeekView(main){
    const weekStart = startOfWeek(cursor);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate()+6);

    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    const label = `${MONTH_NAMES[weekStart.getMonth()].slice(0,3)} ${weekStart.getDate()} – ${weekEnd.getMonth()!==weekStart.getMonth() ? MONTH_NAMES[weekEnd.getMonth()].slice(0,3)+" " : ""}${w[...]
    navRow.innerHTML = `
      <div class="nav-btn" id="prevWeek">&#8249;</div>
      <div class="period-label">${label}</div>
      <div class="nav-btn" id="nextWeek">&#8250;</div>
    `;
    main.appendChild(navRow);

    const attendanceMap = getAttendanceMap();
    let workingAttended = 0;
    const list = document.createElement("div");
    list.className = "week-list";
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(d.getDate()+i);
      const attended = !!attendanceMap[dateKey(d)];
      if(attended) workingAttended++;
      const row = document.createElement("div");
      row.className = "week-row" + (attended ? " attended" : "");
      row.innerHTML = `
        <div>
          <div class="wd-name">${WEEKDAY_FULL[(d.getDay()+6)%7]}</div>
          <div class="wd-date">${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}</div>
        </div>
        <div class="mark">${attended ? "&#10003;" : ""}</div>
      `;
      row.onclick = ()=> toggleAttendance(d);
      list.appendChild(row);
    }
    main.appendChild(list);

    const banner = document.createElement("div");
    banner.className = "total-banner";
    banner.style.marginTop = "16px";
    const wRate = getActiveRate();
    const wCost = workingAttended * wRate;
    if(wRate > 0){
      banner.innerHTML = `
        <div>
          <div class="num">${workingAttended}</div>
          <div class="label">day${workingAttended===1?"":"s"} attended this week</div>
        </div>
        <div style="margin-left:auto; text-align:right;">
          <div class="num" style="color:var(--plum);">${formatMoney(wCost)}</div>
          <div class="label">at ${formatMoney(wRate)}/day</div>
        </div>
      `;
    } else {
      banner.innerHTML = `<div class="num">${workingAttended}</div><div class="label">day${workingAttended===1?"":"s"} attended this week</div>`;
    }
    main.appendChild(banner);

    document.getElementById("prevWeek").onclick = ()=>{
      cursor = new Date(weekStart); cursor.setDate(cursor.getDate()-7);
      render();
    };
    document.getElementById("nextWeek").onclick = ()=>{
      cursor = new Date(weekStart); cursor.setDate(cursor.getDate()+7);
      render();
    };
  }

  function renderYearView(main){
    const year = cursor.getFullYear();
    const navRow = document.createElement("div");
    navRow.className = "nav-row";
    navRow.innerHTML = `
      <div class="nav-btn" id="prevYear">&#8249;</div>
      <div class="period-label">${year}</div>
      <div class="nav-btn" id="nextYear">&#8250;</div>
    `;
    main.appendChild(navRow);

    const grid = document.createElement("div");
    grid.className = "year-grid";
    const yRate = getActiveRate();
    for(let m=0; m<12; m++){
      const total = countWorkingDaysAttended(year, m);
      const card = document.createElement("div");
      card.className = "year-card";
      card.innerHTML = `
        <div class="m-name">${MONTH_NAMES[m].slice(0,3)}</div>
        <div class="m-total">${total}</div>
        <div class="m-sub">${yRate > 0 ? formatMoney(total * yRate) : "days"}</div>
      `;
      card.onclick = ()=>{
        cursor = new Date(year, m, 1);
        state.view = "month";
        render();
      };
      grid.appendChild(card);
    }
    main.appendChild(grid);

    const yearTotal = countWorkingDaysAttendedYear(year);
    const totalLine = document.createElement("div");
    totalLine.className = "year-total";
    totalLine.textContent = yRate > 0
      ? `${yearTotal} day${yearTotal===1?"":"s"} attended · ${formatMoney(yearTotal * yRate)} total in ${year}`
      : `${yearTotal} day${yearTotal===1?"":"s"} attended in ${year}`;
    main.appendChild(totalLine);

    document.getElementById("prevYear").onclick = ()=>{
      cursor = new Date(year-1, cursor.getMonth(), 1);
      render();
    };
    document.getElementById("nextYear").onclick = ()=>{
      cursor = new Date(year+1, cursor.getMonth(), 1);
      render();
    };
  }

  // ---------- Modals ----------

  function closeModal(){
    document.getElementById("modalRoot").innerHTML = "";
  }

  function openAddSheet(){
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3>Add a therapist</h3>
          <input id="newTherapistName" type="text" placeholder="e.g. Dr. Alvarez" autofocus />
          <input id="newTherapistRate" type="number" min="0" step="0.01" placeholder="Per day rate in ₹ (optional)" />
          <div class="row">
            <button class="btn-secondary" id="cancelAdd">Cancel</button>
            <button class="btn-primary" id="confirmAdd">Add</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("overlay").onclick = (e)=>{ if(e.target.id === "overlay") closeModal(); };
    document.getElementById("cancelAdd").onclick = closeModal;
    document.getElementById("confirmAdd").onclick = ()=>{
      const input = document.getElementById("newTherapistName");
      const rateInput = document.getElementById("newTherapistRate");
      const name = input.value.trim();
      if(!name) return;
      const rate = parseFloat(rateInput.value);
      const t = { id: uid(), name, rate: isNaN(rate) ? 0 : rate };
      state.therapists.push(t);
      state.activeTherapistId = t.id;
      saveState();
      closeModal();
      render();
    };
    setTimeout(()=>document.getElementById("newTherapistName").focus(), 50);
  }

  function openManageSheet(){
    const root = document.getElementById("modalRoot");
    const rows = state.therapists.map(t => `
      <div class="existing-therapist">
        <span>${t.name}${t.rate ? ` · ${formatMoney(t.rate)}/day` : ""}</span>
        <span>
          <button class="del-x" style="color:var(--plum);" data-edit="${t.id}">Rate</button>
          <button class="del-x" data-id="${t.id}">Remove</button>
        </span>
      </div>
    `).join("");
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3>Manage therapists</h3>
          ${rows || '<div style="color:var(--ink-soft); font-size:0.88rem;">No therapists yet.</div>'}
          <div class="row" style="margin-top:16px;">
            <button class="btn-secondary" id="closeManage">Done</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("overlay").onclick = (e)=>{ if(e.target.id === "overlay") closeModal(); };
    document.getElementById("closeManage").onclick = closeModal;
    root.querySelectorAll(".del-x[data-id]").forEach(btn=>{
      btn.onclick = ()=> confirmDelete(btn.getAttribute("data-id"));
    });
    root.querySelectorAll(".del-x[data-edit]").forEach(btn=>{
      btn.onclick = ()=> openEditRateSheet(btn.getAttribute("data-edit"));
    });
  }

  function openEditRateSheet(id){
    const t = state.therapists.find(x=>x.id===id);
    if(!t) return;
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3>${t.name} · per day rate (₹)</h3>
          <input id="editRateInput" type="number" min="0" step="0.01" value="${t.rate || ""}" placeholder="e.g. 500" autofocus />
          <div class="row">
            <button class="btn-secondary" id="cancelEditRate">Cancel</button>
            <button class="btn-primary" id="confirmEditRate">Save</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("overlay").onclick = (e)=>{ if(e.target.id === "overlay") closeModal(); };
    document.getElementById("cancelEditRate").onclick = openManageSheet;
    document.getElementById("confirmEditRate").onclick = ()=>{
      const val = parseFloat(document.getElementById("editRateInput").value);
      t.rate = isNaN(val) ? 0 : val;
      saveState();
      openManageSheet();
      render();
    };
    setTimeout(()=>document.getElementById("editRateInput").focus(), 50);
  }

  function openBackupSheet(){
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3>Backup &amp; restore</h3>
          <p style="color:var(--ink-soft); font-size:0.85rem; margin-bottom:16px;">
            Save your data to a file in your Downloads folder, or load a previously saved file back in.
          </p>
          <div class="row" style="margin-bottom:10px;">
            <button class="btn-primary" id="exportBtn">Save to file</button>
          </div>
          <div class="row" style="margin-bottom:16px;">
            <button class="btn-secondary" id="importBtn">Load from file</button>
          </div>
          <input type="file" id="importFileInput" accept="application/json" style="display:none;" />
          <div id="importMsg" style="font-size:0.8rem; color:var(--ink-soft); margin-bottom:12px;"></div>
          <div class="row">
            <button class="btn-secondary" id="closeBackup">Done</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("overlay").onclick = (e)=>{ if(e.target.id === "overlay") closeModal(); };
    document.getElementById("closeBackup").onclick = closeModal;
    document.getElementById("exportBtn").onclick = exportToFile;
    const fileInput = document.getElementById("importFileInput");
    document.getElementById("importBtn").onclick = ()=> fileInput.click();
    fileInput.onchange = (e)=> importFromFile(e.target.files[0]);
  }

  function exportToFile(){
    const payload = {
      therapists: state.therapists,
      attendance: state.attendance,
      activeTherapistId: state.activeTherapistId,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = dateKey(new Date());
    a.href = url;
    a.download = `session-log-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    const msg = document.getElementById("importMsg");
    if(msg) msg.textContent = "Saved to your downloads.";
  }

  function importFromFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state.therapists = parsed.therapists || [];
        state.attendance = parsed.attendance || {};
        state.activeTherapistId = parsed.activeTherapistId || (state.therapists[0] ? state.therapists[0].id : null);
        saveState();
        const msg = document.getElementById("importMsg");
        if(msg) msg.textContent = "Data loaded successfully.";
        render();
      }catch(err){
        const msg = document.getElementById("importMsg");
        if(msg) msg.textContent = "That file couldn't be read. Make sure it's a backup exported from this app.";
      }
    };
    reader.readAsText(file);
  }

  function confirmDelete(id){
    const t = state.therapists.find(x=>x.id===id);
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3>Remove ${t ? t.name : "therapist"}?</h3>
          <p style="color:var(--ink-soft); font-size:0.88rem; margin-bottom:16px;">This deletes all logged attendance for this therapist. This can't be undone.</p>
          <div class="row">
            <button class="btn-secondary" id="cancelDel">Cancel</button>
            <button class="btn-danger" id="confirmDel">Remove</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById("overlay").onclick = (e)=>{ if(e.target.id === "overlay") closeModal(); };
    document.getElementById("cancelDel").onclick = openManageSheet;
    document.getElementById("confirmDel").onclick = ()=>{
      state.therapists = state.therapists.filter(x=>x.id!==id);
      delete state.attendance[id];
      if(state.activeTherapistId === id){
        state.activeTherapistId = state.therapists.length ? state.therapists[0].id : null;
      }
      saveState();
      closeModal();
      render();
    };
  }

  loadState();
})();
</script>
</body>
</html>
